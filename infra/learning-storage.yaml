AWSTemplateFormatVersion: '2010-09-09'
Description: Private GiveGot Learning Hub object bucket. Deploy separately before enabling file APIs.
Parameters:
  BucketName:
    Type: String
    Description: Globally unique private bucket name
  AppOrigin:
    Type: String
    Description: HTTPS origin of the GiveGot browser app, without a trailing slash
Resources:
  LearningStorageBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Ref BucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins:
              - !Ref AppOrigin
            AllowedMethods:
              - POST
              - GET
            AllowedHeaders:
              - Content-Type
              - x-amz-*
            MaxAge: 300
      LifecycleConfiguration:
        Rules:
          - Id: PurgeExpiredUploadStaging
            Status: Enabled
            Prefix: pending/
            ExpirationInDays: 1
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
Outputs:
  LearningStorageBucketName:
    Value: !Ref LearningStorageBucket
